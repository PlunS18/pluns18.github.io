<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="hpBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="hpGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
  </defs>

  <!-- High-Tech Squircle Base -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#hpBg)" stroke="url(#hpGlow)" stroke-width="2.5" />

  <!-- Code Bracket Monogram Design for "HP" -->
  <g fill="none" stroke="url(#hpGlow)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left bracket < -->
    <path d="M16 24L10 32L16 40" stroke-width="3" opacity="0.85" />
    <!-- Right bracket > -->
    <path d="M48 24L54 32L48 40" stroke-width="3" opacity="0.85" />
  </g>

  <!-- Central Bold Monogram HP -->
  <text x="32" y="38" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Outfit', 'Inter', sans-serif" font-weight="900" font-size="20" fill="url(#hpGlow)" letter-spacing="-0.5">
    HP
  </text>

  <!-- Active Online Green Beacon Dot -->
  <circle cx="50" cy="14" r="4" fill="#10b981" />
  <circle cx="50" cy="14" r="2.5" fill="#34d399" />
</svg>
